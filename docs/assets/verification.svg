<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="936" viewBox="0 0 1440 936" role="img"><style>text{font-family:PretendardDoc,Pretendard,"Noto Sans KR",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#7f9bb9"/></marker></defs><rect width="1440" height="936" fill="#101720"/><text x="64" y="72" font-size="40" fill="#eff6ff" font-weight="750">검증 범위를 유지한 개선 기록</text><text x="64" y="115" font-size="24" fill="#c2cede" font-weight="400">서로 다른 두 개선 PR의 실측을 구분했습니다.</text><rect x="64" y="160" width="620" height="555" rx="18" fill="#1b2636" stroke="#40546d" stroke-width="2"/><rect x="756" y="160" width="620" height="555" rx="18" fill="#1b2636" stroke="#40546d" stroke-width="2"/><text x="94" y="212" font-size="28" fill="#9ecaff" font-weight="700">PR #6 · CI 실행 시간</text><text x="94" y="254" font-size="21" fill="#c2cede" font-weight="400">같은 검사 43건 · 단일 실행 비교</text><text x="94" y="310" font-size="21" fill="#c2cede" font-weight="400">변경 전</text><rect x="94" y="328" width="440.0" height="37" rx="8" fill="#667f9c" stroke="#667f9c" stroke-width="2"/><text x="550.0" y="356" font-size="24" fill="#eff6ff" font-weight="700">47초</text><text x="94" y="420" font-size="21" fill="#c2cede" font-weight="400">변경 후</text><rect x="94" y="438" width="355.74468085106383" height="37" rx="8" fill="#8bddc2" stroke="#8bddc2" stroke-width="2"/><text x="465.74468085106383" y="466" font-size="24" fill="#eff6ff" font-weight="700">38초</text><text x="94" y="584" font-size="26" fill="#eff6ff" font-weight="700">전체 작업 47초 → 38초</text><text x="94" y="624" font-size="21" fill="#c2cede" font-weight="400">실행 조건·빌드·타입·검사 범위 유지</text><text x="94" y="665" font-size="18" fill="#94a7be" font-weight="400">고정 절감률이나 청구 분 절감을 뜻하지 않습니다.</text><text x="786" y="212" font-size="28" fill="#9ecaff" font-weight="700">PR #7 · 3G 첫 화면</text><text x="786" y="254" font-size="20" fill="#c2cede" font-weight="400">400kbps · 지연 400ms · CPU 4배 제한</text><text x="786" y="306" font-size="23" fill="#eff6ff" font-weight="650">첫 안내 화면</text><rect x="786" y="326" width="414.00407885791975" height="28" rx="6" fill="#667f9c" stroke="#667f9c" stroke-width="2"/><text x="1214.0040788579197" y="349" font-size="21" fill="#c2cede" font-weight="400">14.50초</text><rect x="786" y="376" width="30.26512576478586" height="28" rx="6" fill="#8bddc2" stroke="#8bddc2" stroke-width="2"/><text x="830.2651257647858" y="399" font-size="21" fill="#c2cede" font-weight="400">1.06초</text><text x="786" y="470" font-size="23" fill="#eff6ff" font-weight="650">로그인 버튼 준비</text><rect x="786" y="490" width="420.0" height="28" rx="6" fill="#667f9c" stroke="#667f9c" stroke-width="2"/><text x="1220.0" y="513" font-size="21" fill="#c2cede" font-weight="400">14.71초</text><rect x="786" y="540" width="172.7396329027872" height="28" rx="6" fill="#8bddc2" stroke="#8bddc2" stroke-width="2"/><text x="972.7396329027872" y="563" font-size="21" fill="#c2cede" font-weight="400">6.05초</text><text x="786" y="665" font-size="18" fill="#94a7be" font-weight="400">각 3회 중앙값 · 캐시 비활성 · 로컬 HTTP 재현</text><rect x="64" y="750" width="1312" height="100" rx="18" fill="#152a2c" stroke="#3f6b64" stroke-width="2"/><text x="94" y="791" font-size="23" fill="#8bddc2" font-weight="700">검증 근거</text><text x="280" y="791" font-size="21" fill="#eff6ff" font-weight="400">PR #6: 43건 통과   /   PR #7: 기존 43건 + 시작 1건 + 렌더링 7건 = 51건</text><text x="94" y="827" font-size="20" fill="#c2cede" font-weight="400">실제 Electron 창·OAuth·플랫폼별 동작은 별도 확인이 필요합니다.</text><text x="64" y="901" font-size="20" fill="#94a7be" font-weight="400">2026-11-06 문서 확인 기준 · PR #6 / #7은 dev 대상 초안이며 미병합</text></svg>