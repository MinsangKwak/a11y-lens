<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img"><style>text{font-family:PretendardDoc,Pretendard,"Noto Sans KR",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#7f9bb9"/></marker></defs><rect width="1440" height="950" fill="#101720"/><text x="64" y="72" font-size="42" fill="#eff6ff" font-weight="750">a11y-lens</text><text x="64" y="116" font-size="25" fill="#c2cede" font-weight="400">개발 브랜치(dev) 기준 검사·이력 대조 구조</text><rect x="64" y="164" width="620" height="158" rx="18" fill="#1b2636" stroke="#40546d" stroke-width="2"/><text x="92" y="210" font-size="28" fill="#9ecaff" font-weight="700">데스크톱 · Electron + React</text><text x="92" y="250" font-size="22" fill="#c2cede" font-weight="400">로그인한 대상 화면을 직접 확인</text><text x="92" y="284" font-size="22" fill="#c2cede" font-weight="400">명암비·접근성 규칙 결과와 위치 표시</text><rect x="756" y="164" width="620" height="158" rx="18" fill="#1b2636" stroke="#40546d" stroke-width="2"/><text x="784" y="210" font-size="28" fill="#9ecaff" font-weight="700">CLI · Playwright</text><text x="784" y="250" font-size="22" fill="#c2cede" font-weight="400">URL 목록을 같은 엔진으로 검사</text><text x="784" y="284" font-size="22" fill="#c2cede" font-weight="400">JSON 보고서와 종료코드 0 / 1 / 2</text><path d="M374 322 V364 H590 V408 M1066 322 V364 H850 V408" fill="none" stroke="#7f9bb9" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="410" width="800" height="168" rx="18" fill="#1b2636" stroke="#40546d" stroke-width="2"/><text x="348" y="456" font-size="28" fill="#8bddc2" font-weight="700">공통 판정 · packages/core</text><text x="348" y="496" font-size="22" fill="#c2cede" font-weight="400">명암비 판정 + axe 규칙 60개 선별·정규화</text><text x="348" y="530" font-size="22" fill="#c2cede" font-weight="400">위반 · 판단 불가 · 합의된 예외 구분</text><path d="M720 578 V622 H252 V654 M720 622 V654 M720 622 H1188 V654" fill="none" stroke="#7f9bb9" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="658" width="400" height="166" rx="18" fill="#1b2636" stroke="#40546d" stroke-width="2"/><text x="92" y="704" font-size="28" fill="#9ecaff" font-weight="700">검사 결과</text><text x="92" y="744" font-size="22" fill="#c2cede" font-weight="400">선택자·실측값·실패 사유</text><text x="92" y="778" font-size="22" fill="#c2cede" font-weight="400">화면 표시 + JSON 보고서</text><rect x="520" y="658" width="400" height="166" rx="18" fill="#1b2636" stroke="#40546d" stroke-width="2"/><text x="548" y="704" font-size="28" fill="#8bddc2" font-weight="700">명암비 이력</text><text x="548" y="744" font-size="22" fill="#c2cede" font-weight="400">Supabase · 계정별 RLS</text><text x="548" y="778" font-size="22" fill="#c2cede" font-weight="400">저장 → 최근 두 검사 대조</text><rect x="976" y="658" width="400" height="166" rx="18" fill="#1b2636" stroke="#40546d" stroke-width="2"/><text x="1004" y="704" font-size="28" fill="#f2d27c" font-weight="700">사람의 확인</text><text x="1004" y="744" font-size="22" fill="#c2cede" font-weight="400">키보드·대체 텍스트 내용</text><text x="1004" y="778" font-size="22" fill="#c2cede" font-weight="400">판단 불가 항목과 실제 화면</text><text x="64" y="881" font-size="21" fill="#c2cede" font-weight="400">접근성 규칙 결과의 서버 이력·대조는 미구현입니다.</text><text x="64" y="916" font-size="19" fill="#94a7be" font-weight="400">구조 설명도 · 실제 Electron 실행 화면 또는 접근성 인증 결과가 아닙니다.</text></svg>