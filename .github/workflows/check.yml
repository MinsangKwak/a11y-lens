# 검사를 사람 손에서 떼어 낸다.
#
# 지침 9장은 기능 브랜치에서 타입 검사와 테스트를, dev 에서 합쳐진 채로 빌드까지 보라고 한다.
# 어느 쪽이든 여기서 전부 돌린다 — 사람이 순서를 기억해야 하는 검증은 언젠가 빠뜨린다.
name: 검사

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm 버전은 package.json 의 packageManager 가 정한다 — lockfile 을 만든 버전과 맞춘다
      - run: corepack enable

      - name: 의존성 설치
        # Electron 바이너리는 150MB 가 넘고 CI 는 GUI 를 띄우지 않는다. 내려받기만 건너뛴다
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        # frozen 이라야 lockfile 이 뜻을 가진다 — 빠지면 CI 가 매번 다른 버전을 깐다
        run: pnpm install --frozen-lockfile

      # 빌드가 먼저다. core 는 dist/index.d.ts 를 타입으로 내보내므로,
      # 빌드 전에는 cli·desktop 의 타입 검사가 @a11y-lens/core 를 찾지 못한다.
      # 손에서는 앞선 작업의 dist 가 남아 통과해 버리는 자리라 CI 에서만 드러난다
      - name: 빌드
        run: pnpm -r build

      - name: 타입 검사
        run: pnpm typecheck

      - name: 테스트
        run: pnpm test
