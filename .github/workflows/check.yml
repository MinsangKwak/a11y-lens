# 검사를 사람 손에서 떼어 낸다.
#
# 지침 9장은 기능 브랜치에서 타입 검사와 테스트를, dev 에서 합쳐진 채로 빌드까지 보라고 한다.
# 어느 쪽이든 여기서 전부 돌린다 — 사람이 순서를 기억해야 하는 검증은 언젠가 빠뜨린다.
name: 검사

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm 버전은 package.json 의 packageManager 가 정한다 — lockfile 을 만든 버전과 맞춘다
      - run: corepack enable

      - name: 의존성 설치
        # Electron 바이너리는 150MB 가 넘고 CI 는 GUI 를 띄우지 않는다. 내려받기만 건너뛴다
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        # frozen 이라야 lockfile 이 뜻을 가진다 — 빠지면 CI 가 매번 다른 버전을 깐다
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: 테스트
        run: pnpm test

      # 번들이 깨지는 자리는 여기서만 드러난다. 타입 검사와 테스트는 통과해도 빌드는 깨질 수 있다
      - name: 빌드
        run: pnpm -r build
